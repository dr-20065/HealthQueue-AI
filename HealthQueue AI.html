<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HealthQueue AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
:root{--bg:#fff;--sf:#f2f8fc;--ink:#0e2a47;--mu:#587186;--ln:#e0eaf2;--bl:#1558d6;--te:#0a9b98;--rd:#d12f2a;--am:#b86e00;--sh:0 6px 24px rgba(21,88,214,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1623;--sf:#12233a;--ink:#e8f1fa;--mu:#9bb2c7;--ln:#223650;--bl:#6ea0ff;--te:#3fd0cc;--rd:#ff7a74;--am:#f0b252;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1623;--sf:#12233a;--ink:#e8f1fa;--mu:#9bb2c7;--ln:#223650;--bl:#6ea0ff;--te:#3fd0cc;--rd:#ff7a74;--am:#f0b252;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
.app{display:flex;min-height:100vh}aside{width:230px;border-right:1px solid var(--ln);padding:20px 14px;position:sticky;top:0;height:100vh;background:var(--sf)}
.logo{font-weight:800;font-size:19px;margin:0 8px 22px;color:var(--bl)}.logo i{color:var(--te);font-style:normal}
.nv{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--mu);padding:10px 12px;border-radius:12px;font:600 14px Figtree,system-ui;cursor:pointer;transition:.2s}
.nv:hover{background:var(--bg)}.nv.on{background:var(--bl);color:#fff}.nv svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;min-width:0;padding:22px 28px 90px;max-width:1100px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}.top h2{margin:0;font-size:24px}
.mob{display:none}
.c{background:var(--bg);border:1px solid var(--ln);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.m{margin:14px 0}
.btn{border:1px solid var(--ln);background:var(--bg);color:var(--ink);padding:9px 15px;border-radius:11px;font:600 14px Figtree,system-ui;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--bl)}.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--te);outline-offset:2px}
.btn.p{background:var(--bl);color:#fff;border-color:var(--bl)}.btn.t{background:var(--te);color:#fff;border-color:var(--te)}.btn.r{background:var(--rd);color:#fff;border-color:var(--rd)}.btn[disabled]{opacity:.5}
input,select{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:11px;background:var(--bg);color:var(--ink);font:inherit}
label{display:block;font-weight:600;font-size:13px;color:var(--mu);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu)}.sm{font-size:13px}
.big{font-size:56px;font-weight:800;color:var(--bl);letter-spacing:.02em;line-height:1.1}.num{font-size:30px;font-weight:800}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sf);color:var(--bl)}
.pill.ok{color:var(--te)}.pill.bad{color:var(--rd)}.pill.wt{color:var(--am)}
.warn{border-left:4px solid var(--am);background:var(--sf);padding:10px 14px;border-radius:10px;font-size:13px}
.em{border-color:var(--rd);background:rgba(209,47,42,.08);color:var(--rd);font-weight:600}
.hero{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:center;padding:14px 0}
.hero h1{font-size:44px;line-height:1.1;margin:0 0 12px;letter-spacing:-.02em}
.chip{display:inline-block;padding:4px 12px;border-radius:10px;background:var(--sf);font-weight:800;margin:0 6px 6px 0}
.bar{height:10px;border-radius:9px;background:var(--sf);overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,var(--bl),var(--te));transition:width .6s}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-size:13px}
.tbw{overflow-x:auto}.pop{animation:pop .6s}@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.ch{width:100%;height:auto}.ch text{font-size:9px;fill:var(--mu);text-anchor:middle}.ch rect{fill:var(--bl);transition:.2s}.ch .pk rect{fill:var(--te)}.ch g:hover rect{opacity:.7}
#toasts{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:50;display:grid;gap:8px;max-width:340px}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:12px;font-size:14px;animation:pop .4s}
#np{position:absolute;right:28px;top:60px;width:320px;max-height:360px;overflow:auto;z-index:20}
@media(max-width:760px){aside{display:none}main{padding:16px 14px 100px}.hero h1{font-size:32px}
.mob{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--ln);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around}
.mob .nv{flex-direction:column;gap:2px;padding:6px 4px;font-size:10px;width:auto}#np{right:14px;left:14px;width:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="toasts"></div><div class="app"><aside id="side"></aside><main><div class="top"><h2 id="ttl"></h2><div class="row"><button class="btn" data-a="notes" id="bell"></button></div></div><div id="np" class="c" hidden></div><div id="al"></div><div id="view"></div></main></div><nav class="mob" id="mob"></nav>
<script>
const KEY="hq_v2",$=s=>document.querySelector(s);
const NAV=[["home","Home","M3 11l9-8 9 8v10h-6v-6H9v6H3z"],["book","Book token","M4 5h16v14H4zM9 5v14"],["track","My queue","M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2"],["display","Live display","M3 4h18v12H3zM8 20h8"],["admin","Admin","M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"],["analytics","Analytics","M4 20V10M10 20V4M16 20v-8M22 20H2"],["manage","Manage","M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3"]];
const names=["Meera Iyer","Arjun Das","Sana Qureshi","Vikram Rao","Latha K","Rahul Shetty","Pooja Nair","Imran Pasha","Divya S","Kiran Gowda","Neha Joshi","Suresh B"];
const pad=(p,n)=>p+String(n).padStart(3,"0");
function seed(){let k=0;const mk=(id,name,pre,doc,avg,sv,wt,hist)=>{const q=[];for(let n=1;n<sv;n++)q.push({tk:pad(pre,n),name:names[k++%12],phone:"98450"+(10000+n),st:"done"});q.push({tk:pad(pre,sv),name:names[k++%12],phone:"9845022001",st:"serving",sa:Date.now()-3e5});for(let i=1;i<=wt;i++)q.push({tk:pad(pre,sv+i),name:names[k++%12],phone:"9845033"+(100+i),st:"waiting"});return{id,name,pre,doc,docSt:"In consultation",avg,paused:false,delay:false,ev:0,n:sv+wt,hist,q}};
return{hosp:"CityCare Multispecialty Hospital",sel:"gm",alert:false,me:null,notes:[],ann:["OPD timings today: 8:00 AM – 6:00 PM","Please carry your previous reports and ID."],depts:[mk("gm","General Medicine","A","Dr. Ananya Rao",8,12,5,[8,9,8,10,8]),mk("pd","Pediatrics","B","Dr. Rohan Mehta",10,5,3,[10,11,9]),mk("ca","Cardiology","C","Dr. Kavita Nair",15,3,4,[14,16,15]),mk("or","Orthopedics","D","Dr. Sameer Khan",12,7,2,[12,13,12]),mk("de","Dermatology","E","Dr. Isha Verma",9,4,3,[9,8,9])]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||seed();
const dp=id=>S.depts.find(d=>d.id===id)||S.depts[0],W=d=>d.q.filter(x=>x.st==="waiting"),SV=d=>d.q.find(x=>x.st==="serving");
const eff=d=>{const h=d.hist.slice(-5);return h.length?(d.avg+h.reduce((a,b)=>a+b,0))/(1+h.length):d.avg};
const ahead=(d,t)=>{const i=W(d).findIndex(x=>x.tk===t);return i<0?0:i+(SV(d)?1:0)};
const est=(d,t)=>Math.round(ahead(d,t)*eff(d));
const fm=m=>m<1?"Now":m<60?m+" minutes":Math.floor(m/60)+(m>=120?" hours":" hour")+(m%60?" "+m%60+" minutes":"");
const ft=t=>new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const dst=d=>d.docSt==="Offline"?"Offline":d.docSt;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;$("#toasts").append(t);setTimeout(()=>t.remove(),4500)}
function notify(m,k){if(S.notes.some(n=>n.k===k))return;S.notes.unshift({m,k,t:Date.now()});S.notes=S.notes.slice(0,30);toast(m)}
function watch(){const m=S.me;if(!m)return;const d=dp(m.dept),e=d.q.find(x=>x.tk===m.tk);if(!e)return;
if(e.st==="serving")notify("Your token "+m.tk+" has been called. Please go to "+d.doc+"’s room.","c"+m.tk);
if(e.st==="waiting"){const a=ahead(d,m.tk);if(a<=2)notify("Your turn is approaching: "+a+" patient"+(a==1?"":"s")+" ahead.","a"+m.tk+a);
const ne=eff(d),f=Math.round(a*m.avg),t=Math.round(a*ne);if(Math.abs(t-f)>=3){m.upd={from:f,to:t,slow:t>f};m.avg=ne;notify("Your waiting time has been updated from "+fm(f)+" to "+fm(t)+".","u"+Date.now())}}
if(d.paused)notify("Queue paused for "+d.name+".","p"+d.id+d.ev);if(d.delay)notify("Doctor delayed: "+d.doc+".","dl"+d.id+d.ev)}
function save(){watch();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
const ic=p=>`<svg viewBox="0 0 24 24"><path d="${p}"/></svg>`;
const route=()=>NAV.some(n=>n[0]===location.hash.slice(1))?location.hash.slice(1):"home";
const tabs=()=>`<div class="row m">${S.depts.map(d=>`<button class="btn ${d.id===S.sel?"p":""}" data-a="sel" data-v="${d.id}">${esc(d.name)}</button>`).join("")}</div>`;
let just=null,last={};
const P={
home(){const d=dp("gm"),s=SV(d),w=W(d);return`<div class="hero"><div><h1>Know when it’s your turn before you leave home.</h1><p class="mu">Take a digital token, watch your place in line, and get a waiting time that corrects itself as the doctor’s day unfolds.</p><div class="row"><button class="btn p" data-a="demo">Try demo</button><button class="btn" data-a="go" data-v="book">Book a token</button><button class="btn" data-a="go" data-v="display">Open live display</button></div></div>
<div class="c"><div class="mu sm">${esc(S.hosp)} · ${esc(d.name)}</div><div class="mu">Now serving</div><div class="big pop">${s?s.tk:"–"}</div><div class="m">${w.slice(0,3).map(x=>`<span class="chip">${x.tk}</span>`).join("")}</div><div class="sm mu">${w.length} waiting · about ${fm(Math.round(eff(d)))} per patient with ${esc(d.doc)}</div></div></div>
<div class="g m">${[["Digital tokens","Book from your phone with a name and number. No registration."],["Smart Queue Predictor","Estimates use how long consultations actually took today."],["Live queue screen","Serving token and next three, animated as staff advance."],["Staff controls","Call, skip, pause, and add emergency cases after triage."]].map(x=>`<div class="c"><b>${x[0]}</b><div class="mu sm">${x[1]}</div></div>`).join("")}</div><div class="warn em">Emergency cases are prioritized by medical staff. This queue is for routine consultations only. If you have a medical emergency, seek immediate assistance.</div>`},
book(){if(just){const d=dp(S.me.dept),a=ahead(d,just),e=est(d,just),t=Date.now()+e*6e4;return`<div class="c" style="text-align:center"><div class="mu">Token confirmed for ${esc(S.me.name||"")}</div><div class="big pop">${just}</div><p>${esc(d.name)} · ${esc(d.doc)}</p><div class="g"><div><div class="num">${a}</div><div class="mu sm">patients ahead</div></div><div><div class="num">${fm(e)}</div><div class="mu sm">estimated wait</div></div><div><div class="num">${ft(t)}</div><div class="mu sm">approximate consultation</div></div></div><div class="row m" style="justify-content:center"><button class="btn p" data-a="go" data-v="track">View my queue</button></div></div>`}
return`<div class="g g2"><div class="c"><label>Hospital</label><select id="bh"><option>${esc(S.hosp)}</option></select><label>Department</label><select id="bd" data-c="bd">${S.depts.map(d=>`<option value="${d.id}" ${d.id===S.sel?"selected":""}>${esc(d.name)}</option>`).join("")}</select><label>Doctor</label><select id="bdoc"><option>${esc(dp(S.sel).doc)}</option></select><label>Patient name</label><input id="bn" placeholder="e.g. Asha Kumar"><label>Phone number or demo ID</label><input id="bp" placeholder="e.g. 9845012345"><div class="m"><button class="btn p" data-a="book">Generate token</button></div></div>
<div class="c"><b>Before you book</b><p class="mu">Your estimate updates automatically as consultations speed up or slow down.</p><div class="warn em">Emergency cases are prioritized by medical staff. This queue is for routine consultations only. If you have a medical emergency, seek immediate assistance.</div><p class="sm mu">There is no emergency option for patients. Staff add urgent cases after triage.</p></div></div>`},
track(){const m=S.me;if(!m)return`<div class="c"><b>No active token</b><p class="mu">Book a token to follow your place in the queue.</p><button class="btn p" data-a="go" data-v="book">Book a token</button></div>`;
const d=dp(m.dept),e=d.q.find(x=>x.tk===m.tk)||{st:"gone"},a=ahead(d,m.tk),mins=est(d,m.tk),t=Date.now()+mins*6e4,sv=SV(d);
const init=Math.max(m.a0||0,a);m.a0=init;const pr=e.st==="waiting"?Math.round((init-a)/Math.max(init,1)*100):100;
let head=e.st==="serving"?`<span class="pill ok">Called: please go in now</span>`:e.st==="waiting"?`<span class="pill ${d.paused?"wt":"ok"}">${d.paused?"Queue paused":"Waiting"}</span>`:`<span class="pill bad">${e.st==="done"?"Completed":e.st==="skipped"?"Skipped by staff":e.st==="cancelled"?"Cancelled":"Not found"}</span>`;
let upd=m.upd&&e.st==="waiting"?`<div class="warn m" style="border-color:${m.upd.slow?"var(--rd)":"var(--te)"}">Your waiting time has been updated from ${fm(m.upd.from)} to ${fm(m.upd.to)} because consultations are ${m.upd.slow?"taking longer":"moving faster"} today.</div>`:"";
return`<div class="g g2"><div class="c"><div class="mu sm">${esc(d.name)} · ${esc(d.doc)}</div><div class="big ${last.me!==e.st?"pop":""}">${m.tk}</div>${head}${e.st==="waiting"?`<div class="g m"><div><div class="num">${a}</div><div class="mu sm">patients ahead</div></div><div><div class="num">${d.paused?"Paused":fm(mins)}</div><div class="mu sm">estimated wait</div></div></div><div class="bar"><div style="width:${pr}%"></div></div>${upd}<div class="warn m">${d.docSt==="Offline"?"The doctor is offline. Wait times will resume when they return.":`Your estimated consultation time is ${ft(t)}. You can arrive around ${ft(Math.max(Date.now(),t-15*6e4))}, subject to hospital instructions.`}</div><div class="sm mu">Estimated time may change depending on consultation duration and emergency cases.</div><div class="row m"><button class="btn r" data-a="cancel">Cancel token</button><button class="btn t" data-a="adv" data-v="${d.id}">Demo: advance queue</button></div>`:`<div class="row m"><button class="btn p" data-a="go" data-v="book" data-v2="new">Book another token</button></div>`}</div>
<div class="c"><b>Queue status</b><div class="g m"><div><div class="mu sm">Now serving</div><div class="num">${sv?sv.tk:"–"}</div></div><div><div class="mu sm">Doctor</div><div class="num" style="font-size:18px">${dst(d)}${d.delay?" (delayed)":""}</div></div><div><div class="mu sm">Avg per patient</div><div class="num">${Math.round(eff(d))} min</div></div></div><b>Hospital announcements</b>${S.ann.map(x=>`<p class="sm mu" style="margin:6px 0">• ${esc(x)}</p>`).join("")}</div></div>`},
display(){const d=dp(S.sel),s=SV(d),w=W(d),k=last.s&&last.s[d.id]!==(s&&s.tk);return tabs()+`<div class="g g2"><div class="c" style="text-align:center"><div class="mu">Currently serving</div><div class="big ${k?"pop":""}" style="font-size:96px">${s?s.tk:"–"}</div><span class="pill ${d.docSt==="Offline"?"bad":d.docSt==="Available"?"ok":""}">${esc(d.doc)}: ${dst(d)}</span>${d.paused?` <span class="pill wt">Queue paused</span>`:""}</div><div class="c"><div class="mu">Next 3 tokens</div><div class="m">${w.slice(0,3).map((x,i)=>`<span class="chip ${k&&!i?"pop":""}" style="font-size:28px">${x.tk}</span>`).join("")||"None waiting"}</div><div class="g"><div><div class="num">${w.length}</div><div class="mu sm">waiting patients</div></div><div><div class="num">${fm(Math.round(eff(d)*(w.length+1)/2))}</div><div class="mu sm">average waiting time</div></div></div></div></div><div class="g m">${S.depts.filter(x=>x.id!==d.id).map(x=>`<div class="c"><b>${esc(x.name)}</b><div class="num">${SV(x)?SV(x).tk:"–"}</div><div class="mu sm">${W(x).length} waiting</div></div>`).join("")}</div>`},
admin(){const d=dp(S.sel),w=W(d),done=d.q.filter(x=>x.st==="done").length,tot=d.q.filter(x=>x.st!=="cancelled").length;
return tabs()+`<div class="g"><div class="c"><div class="mu sm">Total patients today</div><div class="num">${tot}</div></div><div class="c"><div class="mu sm">Currently waiting</div><div class="num">${w.length}</div></div><div class="c"><div class="mu sm">Average waiting time</div><div class="num">${fm(Math.round(eff(d)*(w.length+1)/2))}</div></div><div class="c"><div class="mu sm">Patients served</div><div class="num">${done}</div></div></div>
<div class="g g2 m"><div class="c"><b>Queue controls</b><label>Actual minutes the last consultation took</label><input id="act" type="number" min="1" value="${Math.round(d.avg)}"><div class="row m"><button class="btn p" data-a="next">Call next token</button><button class="btn t" data-a="done">Mark completed</button><button class="btn" data-a="skip">Skip token</button><button class="btn" data-a="pause">${d.paused?"Resume queue":"Pause queue"}</button><button class="btn" data-a="delay">${d.delay?"Clear doctor delay":"Report doctor delay"}</button></div><div class="g"><div><label>Doctor status</label><select data-c="docst">${["Available","In consultation","Offline"].map(x=>`<option ${x===d.docSt?"selected":""}>${x}</option>`).join("")}</select></div><div><label>Avg consultation (min)</label><input type="number" min="1" data-c="avg" value="${d.avg}"></div></div></div>
<div class="c"><b style="color:var(--rd)">Emergency handling (staff only)</b><p class="sm mu">Add a patient only after assessment by qualified triage staff. They move to the front of the waiting list.</p><label>Patient name</label><input id="en"><div class="g"><div><label>Triage level</label><select id="et"><option>Level 1 – Immediate</option><option>Level 2 – Emergent</option></select></div><div><label>Assessed by</label><input id="ea" placeholder="Triage nurse or doctor"></div></div><div class="row m"><button class="btn r" data-a="em">Add emergency patient</button><button class="btn" data-a="alert">${S.alert?"Clear emergency alert":"Raise emergency alert"}</button></div></div></div>
<div class="c"><b>All patients in queue</b><div class="tbw"><table><tr><th>Token</th><th>Name</th><th>Phone / ID</th><th>Status</th></tr>${d.q.filter(x=>x.st!=="done").map(x=>`<tr><td><b>${x.tk}</b></td><td>${esc(x.name)}${x.em?` <span class="pill bad">${esc(x.lv)}</span>`:""}</td><td>${esc(x.phone||"")}</td><td><span class="pill ${x.st==="serving"?"ok":x.st==="waiting"?"":"bad"}">${x.st}</span></td></tr>`).join("")}</table></div></div>`},
analytics(){const hr=[["8",12],["9",28],["10",41],["11",37],["12",22],["13",15],["14",24],["15",31],["16",19],["17",9]],bd=S.depts.map(d=>[d.name.split(" ")[0],d.q.filter(x=>x.st!=="cancelled").length]),aw=S.depts.map(d=>[d.name.split(" ")[0],Math.round(eff(d)*(W(d).length+1)/2)]),sv=S.depts.map(d=>[d.doc.replace("Dr. ","").split(" ")[0],d.q.filter(x=>x.st==="done").length]);
const top=[...hr].sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>+x[0]).sort((a,b)=>a-b);const h12=h=>(h%12||12)+(h<12?" AM":" PM");
return`<div class="warn m">Peak hospital hours: ${h12(top[0])} to ${h12(top[0]+1)} and ${h12(top[1])} to ${h12(top[1]+1)} (sample arrivals). Hover a bar for exact values.</div><div class="g g2"><div class="c"><b>Patients per department</b>${bars(bd,"",1)}</div><div class="c"><b>Hourly patient arrivals</b>${bars(hr,"",1)}</div><div class="c"><b>Average waiting time (minutes)</b>${bars(aw," min",1)}</div><div class="c"><b>Patients served per doctor</b>${bars(sv,"",1)}</div></div>`},
manage(){return`<div class="g g2"><div class="c"><b>Hospital</b><label>Name</label><input data-c="hosp" value="${esc(S.hosp)}"><div class="row m"><button class="btn r" data-a="reset">Reset demo data</button></div></div><div class="c"><b>Announcements</b>${S.ann.map((x,i)=>`<div class="row sm" style="justify-content:space-between;margin:6px 0"><span>${esc(x)}</span><button class="btn" data-a="annx" data-v="${i}">Remove</button></div>`).join("")}<div class="row m"><input id="an" placeholder="New announcement" style="flex:1"><button class="btn p" data-a="anna">Add</button></div></div></div>
<div class="c m"><b>Departments and doctors</b><div class="tbw"><table><tr><th>Department</th><th>Doctor</th><th>Avg min</th><th>Token</th></tr>${S.depts.map(d=>`<tr><td><input data-c="dn:${d.id}" value="${esc(d.name)}"></td><td><input data-c="dd:${d.id}" value="${esc(d.doc)}"></td><td><input type="number" min="1" data-c="da:${d.id}" value="${d.avg}" style="width:80px"></td><td>${d.pre}</td></tr>`).join("")}</table></div>
<b>Add department</b><div class="g"><input id="nd" placeholder="Department name"><input id="ndd" placeholder="Doctor name"><input id="np2" maxlength="2" placeholder="Token letter"><button class="btn p" data-a="add">Add department</button></div></div>`}};
function bars(a,u,hl){const mx=Math.max(...a.map(x=>x[1]),1),w=380/a.length;return`<svg viewBox="0 0 400 165" class="ch" role="img">`+a.map((x,i)=>{const h=x[1]/mx*105,X=10+i*w;return`<g class="${hl&&x[1]===mx?"pk":""}"><rect x="${X+w*.15}" y="${130-h}" width="${w*.7}" height="${h}" rx="4"><title>${x[0]}: ${x[1]}${u}</title></rect><text x="${X+w/2}" y="${125-h}">${x[1]}</text><text x="${X+w/2}" y="148">${x[0]}</text></g>`}).join("")+"</svg>"}
function render(){const r=route();$("#ttl").textContent=NAV.find(n=>n[0]===r)[1];
const nv=NAV.map(n=>`<button class="nv ${n[0]===r?"on":""}" data-a="go" data-v="${n[0]}">${ic(n[2])}<span>${n[1]}</span></button>`).join("");
$("#side").innerHTML=`<div class="logo">Health<i>Queue</i> AI</div>`+nv;$("#mob").innerHTML=NAV.filter(n=>n[0]!=="analytics"&&n[0]!=="manage"||0).map(n=>`<button class="nv ${n[0]===r?"on":""}" data-a="go" data-v="${n[0]}">${ic(n[2])}<span>${n[1].split(" ")[0]}</span></button>`).join("");
$("#bell").textContent="Notifications ("+S.notes.length+")";
$("#al").innerHTML=S.alert?`<div class="warn em m">Emergency alert: staff are handling an emergency case. Waiting times may increase.</div>`:"";
$("#np").innerHTML="<b>Notifications</b>"+(S.notes.map(n=>`<p class="sm" style="margin:8px 0"><span class="mu">${ft(n.t)}</span> ${esc(n.m)}</p>`).join("")||`<p class="mu sm">Nothing yet. Book a token to see alerts here.</p>`);
$("#view").innerHTML=P[r]();last.s={};S.depts.forEach(d=>last.s[d.id]=SV(d)&&SV(d).tk);if(S.me){const e=dp(S.me.dept).q.find(x=>x.tk===S.me.tk);last.me=e&&e.st}}
function active(){return S.me&&["waiting","serving"].includes((dp(S.me.dept).q.find(x=>x.tk===S.me.tk)||{}).st)}
function book(did,n,p){const d=dp(did);d.n++;const tk=pad(d.pre,d.n);d.q.push({tk,name:n,phone:p,st:"waiting"});S.me={dept:d.id,tk,name:n,avg:eff(d)};S.me.a0=ahead(d,tk);just=tk;notify("Token "+tk+" generated for "+n+".","g"+tk);save()}
function next(d){if(d.paused)return toast("Resume the queue first.");const a=+($("#act")||{}).value||d.avg;const c=SV(d);if(c){c.st="done";d.hist.push(a)}const n=W(d)[0];if(n){n.st="serving";n.sa=Date.now();if(d.docSt!=="Offline")d.docSt="In consultation"}else d.docSt=d.docSt==="Offline"?"Offline":"Available";save()}
const A={go(v){if(v==="book")just=null;location.hash=v;render()},demo(){if(!active())book("gm","Demo Patient","demo-0001");just=null;location.hash="track";render()},
sel(v){S.sel=v;save()},
book(){const n=$("#bn").value.trim(),p=$("#bp").value.trim();if(!n||!p)return toast("Enter your name and a phone number or demo ID.");if(active())return toast("You already hold token "+S.me.tk+". Cancel it to book again.");book($("#bd").value,n,p)},
cancel(){const d=dp(S.me.dept),e=d.q.find(x=>x.tk===S.me.tk);if(e&&e.st==="waiting")e.st="cancelled";toast("Token "+S.me.tk+" cancelled.");save()},
adv(v){const d=dp(v);next(d);if(S.me&&S.me.dept===v&&!$("#act")){}},
next(){next(dp(S.sel))},
done(){const d=dp(S.sel),c=SV(d);if(!c)return toast("No patient is being served.");c.st="done";d.hist.push(+$("#act").value||d.avg);d.docSt="Available";save()},
skip(){const d=dp(S.sel),t=SV(d)||W(d)[0];if(!t)return toast("Nothing to skip.");t.st="skipped";if(!SV(d)&&d.docSt!=="Offline")d.docSt="Available";save()},
pause(){const d=dp(S.sel);d.paused=!d.paused;d.ev++;save()},delay(){const d=dp(S.sel);d.delay=!d.delay;d.ev++;save()},
em(){const d=dp(S.sel),n=$("#en").value.trim(),a=$("#ea").value.trim();if(!n||!a)return toast("Enter the patient name and the staff member who assessed them.");d.em=(d.em||0)+1;const i=d.q.findIndex(x=>x.st==="waiting"&&!x.em);d.q.splice(i<0?d.q.length:i,0,{tk:"EM"+String(d.em).padStart(2,"0"),name:n,phone:"Assessed by "+a,st:"waiting",em:1,lv:$("#et").value.split(" –")[0]});toast("Emergency patient added after triage.");save()},
alert(){S.alert=!S.alert;save()},notes(){const e=$("#np");e.hidden=!e.hidden},
anna(){const v=$("#an").value.trim();if(v){S.ann.push(v);save()}},annx(v){S.ann.splice(+v,1);save()},
add(){const n=$("#nd").value.trim(),dd=$("#ndd").value.trim(),p=$("#np2").value.trim().toUpperCase();if(!n||!dd||!p)return toast("Enter a department, doctor, and token letter.");if(S.depts.some(d=>d.pre===p))return toast("That token letter is already in use.");S.depts.push({id:"d"+Date.now(),name:n,pre:p,doc:dd,docSt:"Available",avg:10,paused:false,delay:false,ev:0,n:0,hist:[],q:[]});save()},
reset(){S=seed();just=null;save();toast("Demo data restored.")}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v,b)});
document.addEventListener("change",e=>{const c=e.target.dataset.c;if(!c)return;const v=e.target.value;if(c==="bd"){S.sel=v;$("#bdoc").innerHTML="<option>"+esc(dp(v).doc)+"</option>";return}
const d=dp(S.sel);if(c==="docst"){d.docSt=v;if(v==="Offline")d.ev++}else if(c==="avg")d.avg=Math.max(1,+v||8);else if(c==="hosp")S.hosp=v;else{const[k,id]=c.split(":"),x=dp(id);if(k==="dn")x.name=v;if(k==="dd")x.doc=v;if(k==="da")x.avg=Math.max(1,+v||8)}save()});
window.addEventListener("hashchange",render);
window.addEventListener("storage",e=>{if(e.key===KEY){try{S=JSON.parse(e.newValue)||S}catch(x){}watch();render()}});
render();
